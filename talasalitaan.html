  var scopedKey = function (suffix) {

  var Auth = {

    normalizeUsername: function (u) {

    hash: function (text) {

  ];

  /* ============================================================
     GAME MODES
     ============================================================ */
  var MODES = {
    alab: {
      id: 'alab',
      title: 'Alab ng Talasalitaan',
      subtitle: 'Pagsubok sa Kasingkahulugan',
      desc: 'Piliin ang kasingkahulugan ng malalim na salita.',
      howTo: 'Ipapakita ang isang malalim na salitang Tagalog. Piliin sa apat na pagpipilian ang salitang may kaparehong kahulugan.',
      build: buildSynonymQuestions,
    },
    tinutukoy: {
      id: 'tinutukoy',
      title: 'Ano ang Tinutukoy',
      subtitle: 'Pagtutugma ng Kahulugan',
      desc: 'Basahin ang kahulugan, hanapin ang tamang salita.',
      howTo: 'Babasahin mo ang isang kahulugan. Hanapin sa apat na pagpipilian ang salitang Tagalog na tumutukoy dito.',
      build: buildDefinitionQuestions,
    },
    patlang: {
      id: 'patlang',
      title: 'Punan ang Patlang',
      subtitle: 'Pagkumpleto ng Pangungusap',
      desc: 'Kumpletuhin ang pangungusap gamit ang tamang salita.',
      howTo: 'Kukumpletuhin mo ang isang pangungusap sa pamamagitan ng pagpili ng tamang salitang Tagalog.',
      build: buildFillQuestions,
    },
  };

  function buildSynonymQuestions(count) {
    var pool = shuffle(SYNONYM_PAIRS).slice(0, count);
    return pool.map(function (p) {
      var options = shuffle([p.synonym].concat(p.others.slice(0, 3)));
      var meta = WORDS.filter(function (w) { return w.word === p.word; })[0] || {};
      return {
        prompt: p.word,
        promptLabel: 'Ano ang kasingkahulugan ng salitang ito?',
        options: options,
        answer: p.synonym,
        explanation: meta.meaning || '',
        english: meta.english || '',
        example: meta.example || '',
        translation: meta.translation || '',
      };
    });
  }

  function buildDefinitionQuestions(count) {
    var pool = shuffle(WORDS).slice(0, count);
    return pool.map(function (w) {
      var others = shuffle(WORDS.filter(function (x) { return x.word !== w.word; }))
        .slice(0, 3)
        .map(function (x) { return x.word; });
      var options = shuffle([w.word].concat(others));
      return {
        prompt: w.meaning,
        promptLabel: 'Anong salita ang tinutukoy ng kahulugang ito?',
        options: options,
        answer: w.word,
        explanation: w.meaning,
        english: w.english,
        example: w.example,
        translation: w.translation,
      };
    });
  }

  function buildFillQuestions(count) {
    var pool = shuffle(FILL_SENTENCES).slice(0, count);
    return pool.map(function (s) {
      var options = shuffle(s.others.slice(0, 4));
      if (options.indexOf(s.answer) === -1) options[rand(options.length)] = s.answer;
      options = shuffle(Array.from(new Set(options)));
      return {
        prompt: s.sentence.replace('______', '_____'),
        promptLabel: 'Piliin ang salitang bubuo sa pangungusap.',
        options: options,
        answer: s.answer,
        explanation: s.hint,
        english: '',
        example: s.sentence.replace('______', s.answer),
        translation: '',
      };
    });
  }

  /* ============================================================
     STATS / STREAK / BEST SCORES
     ============================================================ */
  var Stats = {
    load: function () { return readJSON(scopedKey(LS.STATS), { played: 0, correct: 0, total: 0, words: {} }); },
    save: function (s) { writeJSON(scopedKey(LS.STATS), s); },
    recordCorrect: function (word) {
      var s = this.load();
      s.correct += 1; s.total += 1;
      s.words[word] = (s.words[word] || 0) + 1;
      this.save(s);
    },
    recordWrong: function () {
      var s = this.load();
      s.total += 1;
      this.save(s);
    },
    recordGame: function () {
      var s = this.load();
      s.played += 1;
      this.save(s);
    },
    accuracy: function () {
      var s = this.load();
      if (!s.total) return 0;
      return Math.round((s.correct / s.total) * 100);
    },
  };

  var Streak = {
    load: function () { return readJSON(scopedKey(LS.STREAK), { count: 0, last: null }); },
    bump: function () {
      var today = new Date().toDateString();
      var s = this.load();
      if (s.last === today) return s.count;
      var yesterday = new Date(Date.now() - 86400000).toDateString();
      s.count = (s.last === yesterday) ? s.count + 1 : 1;
      s.last = today;
      writeJSON(scopedKey(LS.STREAK), s);
      return s.count;
    },
    value: function () { return this.load().count || 0; },
  };

  var Best = {
    key: function (mode, len) { return mode + ':' + len; },
    load: function () { return readJSON(scopedKey(LS.BEST), {}); },
    get: function (mode, len) { return this.load()[this.key(mode, len)] || 0; },
    set: function (mode, len, score) {
      var b = this.load();
      var k = this.key(mode, len);
      if (score > (b[k] || 0)) { b[k] = score; writeJSON(scopedKey(LS.BEST), b); return true; }
      return false;
    },
  };

  var WordOfDay = {
    today: function () {
      var key = new Date().toDateString();
      var seed = key.split('').reduce(function (a, c) { return a + c.charCodeAt(0); }, 0);
      return WORDS[seed % WORDS.length];
    },
  };

  /* ============================================================
     BACKUP — move a profile's progress to another phone.
     Since there is no server, this is the offline stand-in for
     "logging in on a different device": export a code on phone A,
     paste it into "Ilagay ang Backup Code" on phone B.
     ============================================================ */
  var Backup = {
    exportCode: function () {
      var acc = Auth.current();
      if (!acc) return null;
      var accs = Auth.accounts();
      var account = accs[acc.id];
      var payload = {
        v: 1,
        account: account,
        stats: readJSON(scopedKey(LS.STATS), null),
        streak: readJSON(scopedKey(LS.STREAK), null),
        best: readJSON(scopedKey(LS.BEST), null),
      };
      try {
        return 'TLST1-' + btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
      } catch (e) {
        return null;
      }
    },

    parseCode: function (code) {
      var trimmed = String(code || '').trim();
      if (trimmed.indexOf('TLST1-') !== 0) throw new Error('Hindi valid na backup code.');
      var raw = trimmed.slice(6);
      var json;
      try {
        json = decodeURIComponent(escape(atob(raw)));
      } catch (e) {
        throw new Error('Hindi mabasa ang backup code. Siguraduhing kumpleto ang pagkopya.');
      }
      var payload;
      try {
        payload = JSON.parse(json);
      } catch (e) {
        throw new Error('Sira ang laman ng backup code.');
      }
      if (!payload || !payload.account || !payload.account.username) {
        throw new Error('Hindi kumpleto ang backup code.');
      }
      return payload;
    },

    /* Imports a backup: recreates the account (with its original
       password hash, unchanged) on this device and restores its
       stats/streak/best, then signs into it. */
    importCode: function (code) {
      var payload;
      try {
        payload = this.parseCode(code);
      } catch (e) {
        return Promise.reject(e);
      }
      var account = payload.account;
      var accs = Auth.accounts();
      accs[account.id] = account;
      Auth.saveAccounts(accs);
      Auth._current = { id: account.id, username: account.username };
      writeJSON(LS.ACTIVE, account.id);
      if (payload.stats) writeJSON(scopedKey(LS.STATS), payload.stats);
      if (payload.streak) writeJSON(scopedKey(LS.STREAK), payload.streak);
      if (payload.best) writeJSON(scopedKey(LS.BEST), payload.best);
      return Promise.resolve(Auth._current);
    },
  };

  /* ============================================================
     TOAST
     ============================================================ */
  function toast(message, kind) {
    var host = $('#toastHost');
    if (!host) return;
    var el = document.createElement('div');
    var tone = kind === 'error'
      ? 'bg-maroon text-white'
      : kind === 'warn'
      ? 'bg-[#8A6D3B] text-white'
      : 'bg-ink text-paper';
    el.className = 'pointer-events-auto select-none px-4 py-2.5 rounded-lg text-[13px] font-medium shadow-lg ' + tone;
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    el.style.transition = 'opacity .2s ease, transform .2s ease';
    el.textContent = message;
    host.appendChild(el);
    requestAnimationFrame(function () {
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    });
    setTimeout(function () {
      el.style.opacity = '0';
      el.style.transform = 'translateY(8px)';
      setTimeout(function () { el.remove(); }, 220);
    }, 1800);
  }

  /* ============================================================
     BOTTOM SHEET
     ============================================================ */
  var Sheet = {
    open: function (markup, opts) {
      var backdrop = $('#sheetBackdrop');
      var panel = $('#sheetPanel');
      var body = $('#sheetBody');
      if (!backdrop || !panel || !body) return;
      this._opts = opts || {};
      body.innerHTML = markup;
      backdrop.classList.remove('hidden');
      requestAnimationFrame(function () {
        backdrop.classList.remove('opacity-0');
        panel.classList.remove('translate-y-4', 'sm:scale-95', 'opacity-0');
      });
      backdrop.onclick = function (e) { if (e.target === backdrop) Sheet.close(); };
      document.body.style.overflow = 'hidden';
    },
    close: function () {
      var backdrop = $('#sheetBackdrop');
      var panel = $('#sheetPanel');
      var body = $('#sheetBody');
      if (!backdrop || !panel || !body) return;
      backdrop.classList.add('opacity-0');
      panel.classList.add('translate-y-4', 'sm:scale-95', 'opacity-0');
      var opts = this._opts || {};
      setTimeout(function () {
        backdrop.classList.add('hidden');
        body.innerHTML = '';
        if (typeof opts.onClose === 'function') opts.onClose();
      }, 200);
      document.body.style.overflow = '';
    },
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var backdrop = $('#sheetBackdrop');
      if (backdrop && !backdrop.classList.contains('hidden')) Sheet.close();
    }
  });

  /* ============================================================

     ============================================================ */
  var Screens = {
    current: null,
    show: function (name, markupFn) {
      var host = $('#screen');
      if (!host) return;
      host.innerHTML = markupFn();

  /* ============================================================
     GAME ENGINE
     ============================================================ */
  var Game = {
    mode: null,
    length: 10,
    questions: [],
    index: 0,
    score: 0,
    streak: 0,
    correctCount: 0,
    wrongCount: 0,
    timeLeft: 10,
    timerId: null,
    answered: false,
    history: [],

    start: function (modeId, length) {
      var mode = MODES[modeId];
      if (!mode) return;
      this.mode = mode;
      this.length = length;
      this.questions = mode.build(length);
      this.index = 0;
      this.score = 0;
      this.streak = 0;
      this.correctCount = 0;
      this.wrongCount = 0;
      this.history = [];
      Stats.recordGame();
      this.renderQuestion();
    },

    renderQuestion: function () {
      this.answered = false;
      this.timeLeft = 10;
      var q = this.questions[this.index];
      if (!q) { this.finish(); return; }
      Screens.show('game', function () { return Game.questionMarkup(q); });
      this.attachQuestionHandlers();
      this.startTimer();
    },

    startTimer: function () {
      var self = this;
      clearInterval(this.timerId);
      var tick = function () {
        if (self.answered) return;
        self.timeLeft = Math.max(0, self.timeLeft - 0.1);
        var bar = $('#timerBar');
        var clock = $('#timerClock');
        if (bar) {
          bar.style.width = (self.timeLeft / 10 * 100) + '%';
          bar.className = 'timer-fill h-full rounded-full ' +
            (self.timeLeft > 6 ? 'bg-sage' : self.timeLeft > 3 ? 'bg-[#B98A2E]' : 'bg-maroon');
        }
        if (clock) clock.textContent = Math.ceil(self.timeLeft);
        if (self.timeLeft <= 0) {
          clearInterval(self.timerId);
          self.handleTimeout();
        }
      };
      this.timerId = setInterval(tick, 100);
      tick();
    },

    handleTimeout: function () {
      if (this.answered) return;
      this.answered = true;
      var q = this.questions[this.index];
      this.streak = 0;
      this.wrongCount += 1;
      Stats.recordWrong();
      this.history.push({ prompt: q.prompt, answer: q.answer, correct: false, timedOut: true });
      this.revealAnswer(q, null);
    },

    handleAnswer: function (choice, btn) {
      if (this.answered) return;
      this.answered = true;
      clearInterval(this.timerId);
      var q = this.questions[this.index];
      var correct = choice === q.answer;

      if (correct) {
        var speedBonus = Math.round(this.timeLeft * 6);
        var difficultyBonus = 10;
        var gained = 50 + speedBonus + difficultyBonus + (this.streak * 5);
        this.score += gained;
        this.streak += 1;
        this.correctCount += 1;
        Stats.recordCorrect(q.answer);
        this.history.push({ prompt: q.prompt, answer: q.answer, correct: true, gained: gained });
        if (btn) btn.classList.add('!bg-sage', '!border-sage', '!text-white');
        toast('+' + gained + ' puntos', 'success');
      } else {
        this.streak = 0;
        this.wrongCount += 1;
        Stats.recordWrong();
        this.history.push({ prompt: q.prompt, answer: q.answer, correct: false, chosen: choice });
        if (btn) { btn.classList.add('!bg-maroon', '!border-maroon', '!text-white'); btn.classList.add('shake'); }
        toast('Mali. Tandaan ang salita.', 'error');
      }
      this.revealAnswer(q, choice);
    },

    revealAnswer: function (q, chosen) {
      $$('[data-option]').forEach(function (el) {
        var val = el.getAttribute('data-option');
        if (val === q.answer) el.classList.add('!bg-sage', '!border-sage', '!text-white');
        el.disabled = true;
        el.classList.add('cursor-default');
      });

      var host = $('#explanationHost');
      if (host) {
        var isCorrect = chosen === q.answer;
        var timedOut = chosen === null;
        var heading = timedOut ? 'Ubos ang oras' : (isCorrect ? 'Tama' : 'Mali');
        var headColor = timedOut ? 'text-[#8A6D3B]' : (isCorrect ? 'text-sage' : 'text-maroon');

        var html = '<div class="fade-up border border-[#E5DFD1] bg-white rounded-xl p-4 sm:p-5 space-y-3">';
        html += '<p class="text-[13px] font-semibold uppercase tracking-wide ' + headColor + '">' + esc(heading) + '</p>';
        html += '<div class="space-y-1">';
        html += '<p class="serif text-[17px] font-semibold text-ink">' + esc(q.answer) +
          (q.english ? ' <span class="text-[13px] font-normal text-[#8A8378]">&middot; ' + esc(q.english) + '</span>' : '') + '</p>';
        if (q.explanation) html += '<p class="text-[13.5px] text-[#57534A] leading-relaxed">' + esc(q.explanation) + '</p>';
        html += '</div>';
        if (q.example) {
          html += '<div class="bg-paper border border-[#E5DFD1] rounded-lg px-3.5 py-3">';
          html += '<p class="text-[10px] font-semibold uppercase tracking-wide text-[#9A9384] mb-1">Halimbawa</p>';
          html += '<p class="text-[13px] italic serif text-[#3A362F] leading-relaxed">' + esc(q.example) + '</p>';
          if (q.translation) html += '<p class="text-[12px] text-[#8A8378] mt-1">' + esc(q.translation) + '</p>';
          html += '</div>';
        }
        html += '<button id="nextBtn" class="w-full rounded-lg bg-ink text-paper font-medium text-[14px] py-3 hover:bg-[#3A362F] active:scale-[.99] transition mt-1 focus-ring">' +
          (this.index + 1 >= this.length ? 'Tapusin' : 'Susunod') + '</button>';
        html += '</div>';

        host.innerHTML = html;
        host.classList.remove('hidden');

        var next = $('#nextBtn');
        var self = this;
        if (next) {
          next.addEventListener('click', function () {
            host.classList.add('hidden');
            self.index += 1;
            if (self.index >= self.length) self.finish();
            else self.renderQuestion();
          });
        }
      }

      var scoreEl = $('#gameScore');
      if (scoreEl) scoreEl.textContent = this.score;
    },

    finish: function () {
      var mode = this.mode;
      var pct = this.length ? Math.round((this.correctCount / this.length) * 100) : 0;
      var isBest = Best.set(mode.id, this.length, this.score);

          if (!btn || btn.disabled) return;
          self.handleAnswer(btn.getAttribute('data-option'), btn);
        });
      }

      var skip = $('#skipBtn');
      if (skip) {
        skip.addEventListener('click', function () {
          if (self.answered) return;
          self.answered = true;
          clearInterval(self.timerId);
          var current = self.questions[self.index];
          self.streak = 0;
          self.wrongCount += 1;
          Stats.recordWrong();
          self.history.push({ prompt: current.prompt, answer: current.answer, correct: false, timedOut: true });
          self.revealAnswer(current, null);
        });
      }

      var quit = $('#quitBtn');
      if (quit) {
        quit.addEventListener('click', function () {
          Home.confirm('Lumabas sa laro?', 'Mawawala ang kasalukuyang puntos at hindi ito maibabalik.', 'Lumabas').then(function (ok) {

        });

    },
  };

      });

      var back = $('#backWelcome');
      if (back) back.addEventListener('click', function () { AuthUI.renderWelcome(); });

      var form = $('#createForm');
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var username = $('#createUsername').value;
          var password = $('#createPassword').value;
          var errEl = $('#createError');
          Auth.create(username, password).then(function () {
            toast('Nagawa ang profile.', 'success');
            Home.render();
          }).catch(function (err) {
            if (errEl) { errEl.textContent = err.message; errEl.classList.remove('hidden'); }
          });
        });
      }
    },

    renderLogin: function () {
      Screens.show('login', function () {
        var html = '<div class="space-y-6 pt-2">';
        html += '<div>';
        html += '<button id="backWelcome" class="text-[12.5px] font-medium text-[#8A8378] hover:text-[#57534A] transition mb-4">&larr; Bumalik</button>';
        html += '<h1 class="serif text-[22px] font-semibold text-ink">Mag-login</h1>';
        html += '<p class="text-[12.5px] text-[#8A8378] mt-1">Sa mga profile na ginawa sa telepong ito.</p>';
        html += '</div>';
        html += '<form id="loginForm" class="space-y-3.5">';
        html += '<div class="space-y-1.5">';
        html += '<label class="text-[11px] font-semibold uppercase tracking-wide text-[#9A9384]">Username</label>';
        html += '<input id="loginUsername" type="text" autocomplete="username" class="w-full border border-[#E5DFD1] rounded-lg px-3.5 py-3 text-[14.5px] bg-white focus-ring" />';
        html += '</div>';
        html += '<div class="space-y-1.5">';
        html += '<label class="text-[11px] font-semibold uppercase tracking-wide text-[#9A9384]">Password</label>';
        html += '<input id="loginPassword" type="password" autocomplete="current-password" class="w-full border border-[#E5DFD1] rounded-lg px-3.5 py-3 text-[14.5px] bg-white focus-ring" />';
        html += '</div>';
        html += '<p id="loginError" class="hidden text-[12.5px] font-medium text-maroon"></p>';
        html += '<button type="submit" class="w-full rounded-xl bg-ink text-paper font-medium text-[14.5px] py-3.5 hover:bg-[#3A362F] active:scale-[.99] transition focus-ring">Mag-login</button>';
        html += '</form>';
        html += '</div>';
        return html;
      });

      var back = $('#backWelcome');
      if (back) back.addEventListener('click', function () { AuthUI.renderWelcome(); });

      var form = $('#loginForm');
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var username = $('#loginUsername').value;
          var password = $('#loginPassword').value;
          var errEl = $('#loginError');
          Auth.login(username, password).then(function () {
            toast('Naka-login.', 'success');
            Home.render();
          }).catch(function (err) {
            if (errEl) { errEl.textContent = err.message; errEl.classList.remove('hidden'); }
          });
        });
      }
    },

    renderImport: function () {
      Screens.show('import', function () {
        var html = '<div class="space-y-6 pt-2">';
        html += '<div>';
        html += '<button id="backWelcome" class="text-[12.5px] font-medium text-[#8A8378] hover:text-[#57534A] transition mb-4">&larr; Bumalik</button>';
        html += '<h1 class="serif text-[22px] font-semibold text-ink">Ilagay ang Backup Code</h1>';
        html += '<p class="text-[12.5px] text-[#8A8378] mt-1 leading-relaxed">Kopyahin ang code na nakuha mo sa ibang telepono (mula sa Aking Profile &rarr; I-backup ang Progreso) at idikit dito.</p>';
        html += '</div>';
        html += '<form id="importForm" class="space-y-3.5">';
        html += '<textarea id="importCode" rows="4" class="w-full border border-[#E5DFD1] rounded-lg px-3.5 py-3 text-[13px] font-mono bg-white focus-ring" placeholder="TLST1-..."></textarea>';
        html += '<p id="importError" class="hidden text-[12.5px] font-medium text-maroon"></p>';
        html += '<button type="submit" class="w-full rounded-xl bg-ink text-paper font-medium text-[14.5px] py-3.5 hover:bg-[#3A362F] active:scale-[.99] transition focus-ring">Ibalik ang Profile</button>';
        html += '</form>';
        html += '</div>';
        return html;
      });

      var back = $('#backWelcome');
      if (back) back.addEventListener('click', function () { AuthUI.renderWelcome(); });

      var form = $('#importForm');
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var code = $('#importCode').value;
          var errEl = $('#importError');
          Backup.importCode(code).then(function (acc) {
            toast('Naibalik ang profile ni ' + acc.username + '.', 'success');
            Home.render();
          }).catch(function (err) {
            if (errEl) { errEl.textContent = err.message; errEl.classList.remove('hidden'); }
          });
        });
      }
    },

    openAccountSheet: function () {
      var acc = Auth.current();
      var isGuest = !acc || acc.id === 'guest';

      var body = '<div class="space-y-4">';
      body += '<div>';
      body += '<p class="serif text-[18px] font-semibold text-ink">' + esc(isGuest ? 'Bisita' : acc.username) + '</p>';
      body += '<p class="text-[11.5px] text-[#8A8378] mt-0.5">' + (isGuest ? 'Hindi naka-save ang progreso sa mode na ito.' : 'Naka-save sa telepong ito.') + '</p>';
      body += '</div>';

      if (!isGuest) {
        body += '<div class="bg-paper border border-[#E5DFD1] rounded-xl px-4 py-3.5 space-y-2">';
        body += '<p class="text-[10.5px] font-semibold uppercase tracking-wide text-[#9A9384]">I-backup ang Progreso</p>';
        body += '<p class="text-[12px] text-[#57534A] leading-relaxed">Kopyahin ang code na ito at idikit sa "Ilagay ang Backup Code" sa ibang telepono upang ilipat ang iyong progreso.</p>';
        body += '<button id="genBackup" class="w-full border border-[#E5DFD1] bg-white rounded-lg font-medium text-[13px] py-2.5 hover:bg-paper transition focus-ring">Buuin ang Backup Code</button>';
        body += '<textarea id="backupOutput" readonly rows="3" class="hidden w-full border border-[#E5DFD1] rounded-lg px-3 py-2 text-[11.5px] font-mono bg-white focus-ring"></textarea>';
        body += '<button id="copyBackup" class="hidden w-full bg-ink text-paper rounded-lg font-medium text-[12.5px] py-2.5 hover:bg-[#3A362F] transition focus-ring">Kopyahin ang Code</button>';
        body += '</div>';
      }

      body += '<div class="grid grid-cols-2 gap-2.5 pt-1">';
      body += '<button id="switchAccountBtn" class="border border-[#E5DFD1] rounded-lg font-medium text-[13px] py-3 hover:bg-paper transition focus-ring">Lumipat ng Profile</button>';
      body += '<button id="signOutBtn" class="bg-maroon text-white rounded-lg font-semibold text-[13px] py-3 hover:bg-maroon-dark transition focus-ring">' + (isGuest ? 'Bumalik' : 'Mag-sign Out') + '</button>';
      body += '</div>';
      body += '</div>';

      Sheet.open(body);

      var gen = $('#genBackup');
      if (gen) {
        gen.addEventListener('click', function () {
          var code = Backup.exportCode();
          var out = $('#backupOutput');
          var copyBtn = $('#copyBackup');
          if (code && out) {
            out.value = code;
            out.classList.remove('hidden');
            if (copyBtn) copyBtn.classList.remove('hidden');
          } else {
            toast('Hindi nagawa ang backup code.', 'error');
          }
        });
      }
      var copy = $('#copyBackup');
      if (copy) {
        copy.addEventListener('click', function () {
          var out = $('#backupOutput');
          if (!out) return;
          out.select();
          try {
            navigator.clipboard.writeText(out.value).then(function () {
              toast('Nakopya ang backup code.', 'success');
            }).catch(function () {
              document.execCommand('copy');
              toast('Nakopya ang backup code.', 'success');
            });
          } catch (e) {
            try { document.execCommand('copy'); toast('Nakopya ang backup code.', 'success'); }
            catch (e2) { toast('Hindi makopya. Piliin at kopyahin nang manu-mano.', 'warn'); }
          }
        });
      }
      var switchBtn = $('#switchAccountBtn');
      if (switchBtn) {
        switchBtn.addEventListener('click', function () {
          Sheet.close();
          Auth.signOut();
          setTimeout(function () { AuthUI.renderWelcome(); }, 210);
        });
      }
      var signOut = $('#signOutBtn');
      if (signOut) {
        signOut.addEventListener('click', function () {
          Sheet.close();
          Auth.signOut();
          setTimeout(function () { AuthUI.renderWelcome(); }, 210);
        });
      }
    },
  };

  /* ============================================================
     GLOBAL BINDINGS
     ============================================================ */
  var brandBtn = $('#brandBtn');
  if (brandBtn) brandBtn.addEventListener('click', function () { Home.render(); });

  var accountBtn = $('#accountBtn');
  if (accountBtn) accountBtn.addEventListener('click', function () { AuthUI.openAccountSheet(); });

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (Screens.current === 'game' && Game.answered === false) {
      var key = e.key.toUpperCase();
      var letters = ['A', 'B', 'C', 'D'];
      var idx = letters.indexOf(key);
      if (idx !== -1) {
        var btns = $$('#optionsHost [data-option]');
        if (btns[idx] && !btns[idx].disabled) {
          e.preventDefault();
          Game.handleAnswer(btns[idx].getAttribute('data-option'), btns[idx]);
        }
      } else if (e.key === 'Enter') {
        var next = $('#nextBtn');
        if (next) { e.preventDefault(); next.click(); }
      }
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (Game.timerId) clearInterval(Game.timerId);
    } else if (Screens.current === 'game' && Game.answered === false) {
      Game.startTimer();
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  (function boot() {
    var restored = Auth.restoreSession();
    if (restored) {
      Home.render();
    } else {
      AuthUI.renderWelcome();
    }
    Home.refreshAccountLabel();
  })();

  window.Talasalitaan = { Game: Game, Home: Home, Screens: Screens, Stats: Stats, Streak: Streak, Best: Best, Auth: Auth, Backup: Backup, WORDS: WORDS, MODES: MODES };
})();
</script>
</body>
</html>
